name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test-and-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit + gateway tests
        run: pytest -q
      - name: Red-team gate (fails if any attack succeeds or benign traffic is blocked)
        run: python -m tripwire.gate
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: redteam-results, path: redteam/results.json}

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secrets scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Trivy filesystem scan (deps, misconfig, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scanners: "vuln,misconfig,secret", severity: "HIGH,CRITICAL", exit-code: "1", skip-dirs: "redteam,tests"}

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: infra/terraform
        run: terraform fmt -check && terraform init -backend=false && terraform validate
      - name: Checkov (Terraform + Kubernetes + Dockerfile)
        uses: bridgecrewio/checkov-action@v12
        with: {directory: infra, framework: "terraform,kubernetes"}

  image:
    runs-on: ubuntu-latest
    needs: [test-and-redteam, supply-chain, iac]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tripwire:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "tripwire:${{ github.sha }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true}
